name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/tests/widget_js/package-lock.json

      # `make test` expects the venv at backend/.venv, as ./dev.sh creates it.
      # The tests set their own secrets and database, so no backend/.env is needed.
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-dev.txt

      - name: Install widget test dependencies
        run: npm ci --no-audit --no-fund
        working-directory: backend/tests/widget_js

      - name: Run tests
        run: make test
