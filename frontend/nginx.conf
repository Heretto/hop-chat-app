# One origin for everything: the admin UI, the API, and the visitor-facing
# chat (/c/…, /embed/…, /widget/…). Set PUBLIC_BASE_URL to this origin.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Chat replies stream as server-sent events: do not buffer them.
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # Visitor-facing chat pages, embed loader and widget assets.
    location ~ ^/(c|embed|widget)/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
