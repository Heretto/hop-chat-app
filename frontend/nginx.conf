# One origin for everything: the admin UI, the API, and the visitor-facing
# pages (chat /c/…, search answers /a/…, /embed/…, /widget/…). Set
# PUBLIC_BASE_URL to this origin.
#
# nginx is either the edge (docker-compose.yml publishes it directly) or sits
# behind another proxy on a private Docker network (deploy/shared-vm: Caddy
# terminates TLS). Forwarding headers are believed only from such a private
# proxy; from anyone else they are replaced with what nginx itself sees. That
# keeps the per-IP rate limits keyed to the real visitor and stops a visitor
# spoofing their address with an X-Forwarded-For header of their own.

# Was this request handed to us by a proxy on a private network?
geo $realip_remote_addr $from_private_proxy {
    default         0;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
    127.0.0.0/8     1;
}

# The scheme the visitor used: the proxy's word for it if we trust the proxy.
map "$from_private_proxy:$http_x_forwarded_proto" $visitor_scheme {
    "1:https"  https;
    "1:http"   http;
    default    $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # $remote_addr becomes the visitor's address when a private proxy reports it.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header   X-Forwarded-For;

    location /api/ {
        proxy_pass         http://hop-chat-backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # One address, not a chain: uvicorn trusts the first entry it is given.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $visitor_scheme;
        # Chat replies stream as server-sent events: do not buffer them.
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # Visitor-facing pages (chat /c/, search answers /a/), embed loaders and widget assets.
    location ~ ^/(c|a|embed|widget)/ {
        proxy_pass         http://hop-chat-backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $visitor_scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
