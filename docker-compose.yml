# docker compose up --build   →   http://localhost:8080
# Reads ./.env (copy .env.example). The admin UI, API and chat share one origin.
#
# Service names are prefixed so they stay unique on a Docker network shared with
# other apps (deploy/shared-vm): plain "frontend"/"backend" would be registered
# there too, and another app's proxy could resolve them to these containers.
services:
  hop-chat-backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?not set — see .env.example}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?not set — see .env.example}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?not set — see .env.example}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/hop-chat.db}
      FRONTEND_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ORIGINS: ${PUBLIC_BASE_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_MESSAGE_RATE_LIMIT: ${PUBLIC_MESSAGE_RATE_LIMIT:-20/minute}
      PUBLIC_SEARCH_RATE_LIMIT: ${PUBLIC_SEARCH_RATE_LIMIT:-30/minute}
      # hop-core's sign-up and sign-in settings, passed through unchanged; hop-core
      # enforces them. SSO_ONLY=true refuses every password route (sign-up,
      # login, reset, password-based invitation acceptance) and the login page
      # offers only Google/Microsoft. See .env.example and hop-core's AGENTS.md
      # ("SSO-only deployments"). Unset values keep hop-core's defaults.
      SSO_ONLY: ${SSO_ONLY:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_TENANT_ID: ${MICROSOFT_OAUTH_TENANT_ID:-common}
      # Where SSO providers send people back; the Microsoft callback is
      # {this}/api/v1/auth/sso/microsoft/callback. Defaults to PUBLIC_BASE_URL.
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-${PUBLIC_BASE_URL:-http://localhost:8080}}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      SINGLE_ORG_MODE: ${SINGLE_ORG_MODE:-false}
      SINGLE_ORG_SLUG: ${SINGLE_ORG_SLUG:-}
      SINGLE_ORG_NAME: ${SINGLE_ORG_NAME:-}
    volumes:
      - chat-data:/data
    restart: unless-stopped

  hop-chat-web:
    build: ./frontend
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - hop-chat-backend
    restart: unless-stopped

volumes:
  chat-data:
