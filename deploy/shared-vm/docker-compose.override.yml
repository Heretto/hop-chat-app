# HOP Chat on a VM shared with other services, behind one reverse proxy.
# Layered on the main compose file — from the repo root:
#
#   docker compose -f docker-compose.yml -f deploy/shared-vm/docker-compose.override.yml up -d --build
#
# Compared with the main file: no published port (the proxy is the only way
# in), the web container joins the proxy's Docker network as "hop-chat", the
# backend gets a memory cap so it cannot crowd out its neighbours, and logs
# are rotated. Needs Docker Compose 2.24 or later for `!reset`.
#
# The proxy's network is "edge" (this folder's Caddy stack) unless
# HOP_CHAT_PROXY_NETWORK in the repo-root .env names another — for example an
# existing app's network when its nginx is the VM's entry point
# (README.md, "Behind an existing nginx"). Only the web container joins it; the
# backend stays on HOP Chat's own network.
#
# No `name:` here on purpose: changing the project name renames the data
# volume, and an existing deployment would come up on an empty database.

services:
  hop-chat-backend:
    mem_limit: 512m     # measured ~100 MB in use; this leaves plenty of headroom
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  hop-chat-web:
    ports: !reset []
    mem_limit: 128m
    networks:
      default:
      proxy:
        aliases: [hop-chat]
    logging: *logs

networks:
  proxy:
    external: true
    name: ${HOP_CHAT_PROXY_NETWORK:-edge}
