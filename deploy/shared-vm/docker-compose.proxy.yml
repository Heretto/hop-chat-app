# The VM's single entry point: Caddy, with automatic HTTPS for every service.
#
#   cd deploy/shared-vm
#   cp .env.example .env            # set ACME_EMAIL and the hostnames
#   docker compose -f docker-compose.proxy.yml up -d
#
# It creates the shared "edge" network that each service joins, so start it
# before the services (or create the network yourself: docker network create edge).
name: edge

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # certificates and ACME account: keep it
      - caddy-config:/config
    networks:
      - edge
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  edge:
    name: edge

volumes:
  caddy-data:
  caddy-config:
