# The VM's single entry point: Caddy, with automatic HTTPS for every service.
#
# It belongs to the VM, not to any one app: copy this file, the Caddyfile and
# .env.example to a directory of their own (e.g. ~/edge), then
#
#   docker network create edge      # once per VM; every app joins it
#   cp .env.example .env            # set ACME_EMAIL and the hostnames
#   docker compose -f docker-compose.proxy.yml up -d
#
# The network is created by hand rather than by this file so that any stack —
# this one or an app's — can start first.
name: edge

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # certificates and ACME account: keep it
      - caddy-config:/config
    networks:
      - edge
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  edge:
    external: true
    name: edge

volumes:
  caddy-data:
  caddy-config:
