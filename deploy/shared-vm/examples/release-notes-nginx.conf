# Example: the Release Notes Agent's nginx, moved behind the VM's Caddy.
# Copy over that app's deployment/nginx-production.conf (see ../README.md,
# "Moving an existing app behind Caddy").
#
# Nginx Production Configuration — behind the VM's edge proxy (Caddy)
#
# Caddy (~/edge) owns ports 80/443, terminates TLS and renews certificates; it
# forwards releasenotes.herettoopenprojects.ai here over plain HTTP on the
# shared "edge" Docker network. So this server listens on 80 only, never
# redirects to HTTPS (that would loop), and takes the visitor's address and
# scheme from Caddy's forwarding headers.
#
# Routing, rate limits, headers and timeouts are those of the previous HTTPS
# server block, unchanged.

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

# The visitor's real address, as reported by Caddy (or any proxy on a private
# Docker network). Without this every request would come from Caddy's address
# and the per-IP rate limits below would throttle all visitors together.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header   X-Forwarded-For;

# The scheme the visitor used (https via Caddy).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    client_max_body_size 100M;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location /api/v1/auth/ {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://backend/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check (for the edge proxy and monitoring)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain always;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            expires 30d;
            add_header Cache-Control "public, immutable" always;
        }
    }

    location ~ /\. {
        deny all;
    }
}
