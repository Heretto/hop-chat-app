# HOP Chat behind an nginx that is already the VM's entry point (another app's
# reverse proxy). Add these two server blocks to that nginx's configuration,
# replace chat.example.com everywhere, and reload it. See README.md, "Behind an
# existing nginx".
#
# Assumes: that nginx is on the Docker network named by HOP_CHAT_PROXY_NETWORK
# (so it can reach HOP Chat as "hop-chat"), certbot on the host issues
# certificates into /etc/letsencrypt (mounted into the nginx container), and
# the ACME webroot is /var/www/certbot inside the container.

# IPv4 listeners only: Docker forwards IPv6
# traffic to the container over IPv4, and `listen [::]` fails to start nginx in
# a container without IPv6.

# Plain HTTP: certificate challenges, everything else to HTTPS.
server {
    listen 80;
    server_name chat.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # No X-Frame-Options or Content-Security-Policy here: HOP Chat sets its own,
    # and its chat pages must be embeddable on other sites.

    # Look up HOP Chat per request (Docker's DNS), not once at startup: if HOP
    # Chat is down, only this site answers 502 and this nginx still starts and
    # reloads for everything else it serves.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hop_chat http://hop-chat:80;

    client_max_body_size 1m;

    location / {
        proxy_pass         $hop_chat;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        # One address — the visitor's — never a client-supplied chain.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        # Answers stream as server-sent events: pass them through as written.
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }
}
